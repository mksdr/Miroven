version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Keep Node.js types on the runtime major; upgrade both manually.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    # Current actions run on Node.js 24. Review major upgrades manually,
    # including each action's runs.using runtime and runner requirements.
    # Dependabot cannot filter action updates by their Node.js runtime.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    # Receive Node.js minor/patch updates; runtime major upgrades are manual.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
