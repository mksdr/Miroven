name: HEIC source and relinking verification

on:
  pull_request:
    paths:
      - 'tools/heic/**'
      - 'web/vendor/heic/**'
      - 'web/scripts/**'
      - 'web/app/lib/heic-decoder.ts'
      - 'web/app/notice/**'
      - 'web/tests/**'
      - 'web/package*.json'
      - 'web/next.config.ts'
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitattributes'
      - '.github/workflows/heic-rebuild.yml'
  push:
    branches: [main]
    paths:
      - 'tools/heic/**'
      - 'web/vendor/heic/**'
      - 'web/scripts/**'
      - 'web/app/lib/heic-decoder.ts'
      - 'web/app/notice/**'
      - 'web/tests/**'
      - 'web/package*.json'
      - 'web/next.config.ts'
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitattributes'
      - '.github/workflows/heic-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-relink:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the vendor application and source download
        run: |
          mkdir -p license-reports
          set -o pipefail
          npm run build 2>&1 | tee license-reports/heic-application.log
      - name: Rebuild native libraries and application from the source download
        run: |
          set -o pipefail
          npm run heic:verify:source 2>&1 | tee license-reports/heic-source.log
      - name: Decode using the original vendor libraries
        run: npx playwright test tests/e2e/images.spec.ts --project chromium --grep 'real example'
      - name: Modify both native libraries, relink and decode
        run: |
          set -o pipefail
          npm run heic:verify:relink 2>&1 | tee license-reports/heic-relink.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: heic-rebuild-evidence
          path: |
            web/license-reports/heic-*.log
            web/vendor/heic/manifest.json
            web/vendor/heic/native-sha256.txt
            web/vendor/heic/toolchain.txt
            web/out/source/manifest.json
          retention-days: 30
          if-no-files-found: error
