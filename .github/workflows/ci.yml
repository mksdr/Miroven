name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Web Unit & Local E2E Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      # Only verify on the default branch writes caches; all jobs can restore them.
      - name: Restore npm downloads
        id: npm-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ~/.npm/_cacache
          key: miroven-npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            miroven-npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: web/.next/cache
          key: miroven-next-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/public/**', 'web/scripts/**', 'web/*.json', 'web/*.ts', 'web/*.mjs') }}
          restore-keys: |
            miroven-next-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('web/package-lock.json') }}-

      - name: Install Chromium, Firefox and WebKit
        run: |
          # Playwright needs Ubuntu packages, not the runner's Microsoft feeds.
          # Disable those feeds to avoid unrelated packages.microsoft.com 403s.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -Eq 'https?://packages\.microsoft\.com/' "$source"; then
              sudo mv -- "$source" "${source}.disabled"
            fi
          done
          npx playwright install --with-deps chromium firefox webkit

      - name: Full verification
        run: npm run verify:full

      # GitHub's default repository limit is 10 GiB, with automatic eviction.
      # Bound each upload too; PRs and integration never create duplicate entries.
      - name: Check cache upload sizes
        id: cache-sizes
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        run: |
          for cache in npm next; do
            if [ "$cache" = npm ]; then
              cache_path="$HOME/.npm/_cacache"
            else
              cache_path=".next/cache"
            fi
            eligible=false
            if [ -d "$cache_path" ]; then
              size=$(du -sb "$cache_path" | cut -f1)
              if [ "$size" -le 536870912 ]; then
                eligible=true
              else
                echo "::notice::Skipping $cache cache upload: $size bytes exceeds 512 MiB."
              fi
            fi
            echo "$cache=$eligible" >> "$GITHUB_OUTPUT"
          done

      - name: Save npm downloads
        if: steps.cache-sizes.outputs.npm == 'true' && steps.npm-cache.outputs.cache-hit != 'true' && steps.npm-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ~/.npm/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Save Next.js build cache
        if: steps.cache-sizes.outputs.next == 'true' && steps.next-cache.outputs.cache-hit != 'true' && steps.next-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: web/playwright-report/
          retention-days: 14

      - name: Upload license verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-verification
          path: web/license-reports/report.json
          if-no-files-found: ignore
          retention-days: 14

  integration-e2e:
    name: Full-stack API & Sync E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out Miroven
        uses: actions/checkout@v4
        with:
          path: Miroven

      - name: Check out Miroven-API
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Miroven-API
          path: Miroven-API
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Inspect API availability
        id: check-api
        run: |
          if [ -d "Miroven-API" ] && [ -f "Miroven-API/compose.yaml" ]; then
            echo "has_api=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_api=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check-api.outputs.has_api == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: steps.check-api.outputs.has_api == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Restore shared npm downloads
        if: steps.check-api.outputs.has_api == 'true'
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ~/.npm/_cacache
          key: miroven-npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('Miroven/web/package-lock.json') }}
          restore-keys: |
            miroven-npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-

      - name: Install Miroven dependencies & Chromium
        if: steps.check-api.outputs.has_api == 'true'
        working-directory: Miroven/web
        run: |
          npm ci --prefer-offline
          npm run build
          # Keep the same APT workaround as the local E2E job above.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -Eq 'https?://packages\.microsoft\.com/' "$source"; then
              sudo mv -- "$source" "${source}.disabled"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Start Combined Docker Stack
        id: start-stack
        if: steps.check-api.outputs.has_api == 'true'
        working-directory: Miroven-API
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked
          uv run python scripts/bootstrap_local.py
          # Also collect logs and clean up if Compose only starts part of the stack.
          echo "compose_attempted=true" >> "$GITHUB_OUTPUT"
          docker compose -f compose.yaml -f compose.web.yaml up -d --build --wait --wait-timeout 180

      - name: Run Full-stack E2E (api-sync.spec.ts)
        id: integration-tests
        if: steps.check-api.outputs.has_api == 'true'
        working-directory: Miroven/web
        env:
          MIROVEN_INTEGRATION_URL: "http://localhost:8080"
          MIROVEN_MAILPIT_URL: "http://localhost:8025"
        run: |
          npx playwright test tests/e2e/api-sync.spec.ts --project=chromium

      - name: Upload Docker logs on failure
        if: failure() && steps.start-stack.outputs.compose_attempted == 'true'
        working-directory: Miroven-API
        run: |
          docker compose -f compose.yaml -f compose.web.yaml logs --tail 100

      - name: Upload Playwright integration report on failure
        if: failure() && steps.integration-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integration
          path: Miroven/web/playwright-report/
          retention-days: 14

      - name: Tear down Combined Docker Stack
        if: always() && steps.start-stack.outputs.compose_attempted == 'true'
        working-directory: Miroven-API
        run: |
          docker compose -f compose.yaml -f compose.web.yaml down
